PACKAGE_NAME="uniwill-laptop"
_DKMS_CONF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
PACKAGE_VERSION="$(<"${_DKMS_CONF_DIR}/VERSION")"
unset _DKMS_CONF_DIR

BUILT_MODULE_NAME[0]="uniwill-laptop"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make KDIR=/lib/modules/${kernelver}/build clean"

AUTOINSTALL="yes"
